name: Production smoke test

# Run by hand after `npm run deploy`: checks the page, the prepared data and every proxy route
# of the deployed Worker from outside the developer's network.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed URL
        default: https://quake-trace.ozcelikcode.workers.dev

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ inputs.base_url }}
    steps:
      - name: Page and prepared data
        run: |
          curl -fsS "$BASE/" | grep -q '<div id="root">'
          curl -fsS "$BASE/data/manifest.json" | grep -q '"datasets"'
          curl -fsS -o /dev/null "$BASE/data/faults.geojson"
      - name: Caching and compression
        run: |
          headers() {
            echo "== $1"
            curl -fsS -o /dev/null -D - -H 'Accept-Encoding: gzip, br' "$BASE$1" \
              | grep -iE '^(content-type|content-encoding|cache-control|content-length):'
          }
          script=$(curl -fsS "$BASE/" | grep -o '/assets/[^"]*\.js' | head -1)
          headers "$script"
          headers "/data/manifest.json"
          headers "/data/vs30.f32.gz"
          headers "$script" | grep -qi 'immutable'
          headers "/data/vs30.f32.gz" | grep -qi 'application/gzip'
      - name: Proxy routes
        run: |
          day=$(date -u +%Y-%m-%d)
          failed=0
          check() {
            code=$(curl -s -o body -w '%{http_code} %{time_total}s' --max-time 40 "$BASE$1")
            echo "$code $(wc -c < body) bytes  $1"
            case "$code" in 200*) ;; *) failed=1 ;; esac
          }
          check "/api/kandilli/lst0.asp"
          check "/api/koeri/station/1/query?net=KO&sta=SLVT&cha=HN?&level=station&format=text"
          check "/api/afad/event/filter?start=${day}T00:00:00&end=${day}T23:59:59&minlat=39.8&maxlat=41.8&minlon=26&maxlon=31"
          exit $failed
      - name: Unknown routes are refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/nope")
          echo "status $code"
          test "$code" -ge 400
